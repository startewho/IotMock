[package]
name = "iot-mock"
version = "0.1.0"
edition = "2021"
description = "IoT protocol simulator with a GPUI desktop UI - Modbus TCP now, extensible to S7 and more"
license = "Apache-2.0"

[dependencies]
gpui = "0.2.2"
gpui-component ={version="0.5.1",features=["inspector"]}
gpui-component-assets = "0.5.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
